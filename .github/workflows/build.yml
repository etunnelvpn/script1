name: Build E-TUNNEL Binary

on:
  push:
    paths:
      - 'etunnel-v1.0.0.sh'
      - 'panel/**'
      - 'components/**'
      - 'config/**'
      - 'issue.net'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shc
          echo "shc installed: $(shc -v 2>&1 | head -1)"

      - name: Compile etunnel-v1.0.0.sh with shc
        run: |
          shc -r -f etunnel-v1.0.0.sh -o etunnel
          chmod +x etunnel
          rm -f etunnel-v1.0.0.sh.x.c
          echo "Binary size: $(du -sh etunnel | cut -f1)"
          file etunnel

      - name: Extract panel files from script heredocs
        run: |
          # Extract panel/etunnel content from inside the PANEL heredoc
          awk '/^cat > \/usr\/local\/bin\/menu <<.PANEL./{found=1; next} found && /^PANEL$/{exit} found{print}' etunnel-v1.0.0.sh > panel/etunnel
          chmod +x panel/etunnel

          # Extract watchdog
          awk '/^cat > \/usr\/local\/bin\/etunnel-watchdog.sh <<.WDPY./{found=1; next} found && /^WDPY$/{exit} found{print}' etunnel-v1.0.0.sh > panel/etunnel-watchdog.sh
          chmod +x panel/etunnel-watchdog.sh

          # Extract quota-check
          awk '/^cat > \/usr\/local\/bin\/etunnel-quota-check.py <<.PYCHECK./{found=1; next} found && /^PYCHECK$/{exit} found{print}' etunnel-v1.0.0.sh > panel/etunnel-quota-check.py

          # Extract bridge.py
          awk '/^cat > \/opt\/universal-bridge\/bridge.py << .BRIDGEEOF./{found=1; next} found && /^BRIDGEEOF$/{exit} found{print}' etunnel-v1.0.0.sh > components/universal-bridge/bridge.py

          # Extract rocket-proxy.js
          awk "/^cat > \/opt\/rocket\/rocket-proxy.js <<'JSEOF'/{found=1; next} found && /^JSEOF\$/{exit} found{print}" etunnel-v1.0.0.sh > components/rocket-proxy/rocket-proxy.js

          echo "Panel files extracted:"
          head -1 panel/etunnel
          head -1 panel/etunnel-watchdog.sh
          head -1 panel/etunnel-quota-check.py
          head -1 components/universal-bridge/bridge.py

      - name: Set release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "tag=$TAG"

      - name: Commit updated panel files and binary
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panel/ components/ config/ issue.net etunnel
          git diff --cached --quiet || git commit -m "Auto-build: compile + sync panel files [${{ steps.tag.outputs.tag }}]"
          git push

      - name: Create GitHub Release with binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "E-TUNNEL VPN ${{ steps.tag.outputs.tag }}"
          body: |
            ## E-TUNNEL VPN — Auto Build by EMMKASH TECH

            ### Install on your VPS
            ```bash
            curl -fsSL https://github.com/etunnelvpn/script1/releases/latest/download/etunnel -o /tmp/etunnel && bash /tmp/etunnel
            ```
            ### With domain pre-set
            ```bash
            curl -fsSL https://github.com/etunnelvpn/script1/releases/latest/download/etunnel -o /tmp/etunnel && bash /tmp/etunnel yourdomain.com
            ```
            > Compiled for Linux x86_64 — Ubuntu 20.04 / 22.04 / 24.04
          files: etunnel
          draft: false
          prerelease: false