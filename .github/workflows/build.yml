name: Build E-TUNNEL Binary

on:
  push:
    paths:
      - 'etunnel-v1.0.0.sh'
      - 'etunnel-v1.0.0-p2.sh'
      - 'panel/**'
      - 'components/**'
      - 'config/**'
      - 'issue.net'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify sources are shell scripts
        run: |
          for f in etunnel-v1.0.0.sh etunnel-v1.0.0-p2.sh; do
            if file "$f" | grep -q "ELF"; then
              echo "ERROR: $f is already a binary - push the .sh source"
              exit 1
            fi
            echo "OK: $f ($(wc -l < $f) lines)"
          done

      - name: Install shc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shc
          echo "shc: $(shc -v 2>&1 | head -1)"

      - name: Compile both parts with shc
        run: |
          # Save source copies for panel extraction
          cp etunnel-v1.0.0.sh etunnel-src-p1.sh
          cp etunnel-v1.0.0-p2.sh etunnel-src-p2.sh

          # Compile Part 1
          shc -r -f etunnel-src-p1.sh -o etunnel-v1.0.0.sh
          chmod +x etunnel-v1.0.0.sh
          rm -f etunnel-src-p1.sh etunnel-src-p1.sh.x.c
          echo "Part 1 binary: $(du -sh etunnel-v1.0.0.sh | cut -f1)"

          # Compile Part 2
          shc -r -f etunnel-src-p2.sh -o etunnel-v1.0.0-p2.sh
          chmod +x etunnel-v1.0.0-p2.sh
          rm -f etunnel-src-p2.sh etunnel-src-p2.sh.x.c
          echo "Part 2 binary: $(du -sh etunnel-v1.0.0-p2.sh | cut -f1)"

          file etunnel-v1.0.0.sh
          file etunnel-v1.0.0-p2.sh

      - name: Extract panel files from Part 1 source (via git)
        run: |
          git show HEAD:etunnel-v1.0.0-p2.sh > etunnel-src-extract.sh

          awk '/^cat > \/usr\/local\/bin\/menu <<.PANEL./{found=1;next} found && /^PANEL$/{exit} found{print}' \
            etunnel-src-extract.sh > panel/etunnel && chmod +x panel/etunnel

          awk '/^cat > \/usr\/local\/bin\/etunnel-watchdog.sh <<.WDPY./{found=1;next} found && /^WDPY$/{exit} found{print}' \
            etunnel-src-extract.sh > panel/etunnel-watchdog.sh && chmod +x panel/etunnel-watchdog.sh

          awk '/^cat > \/usr\/local\/bin\/etunnel-quota-check.py <<.PYCHECK./{found=1;next} found && /^PYCHECK$/{exit} found{print}' \
            etunnel-src-extract.sh > panel/etunnel-quota-check.py

          awk '/^cat > \/opt\/universal-bridge\/bridge.py << .BRIDGEEOF./{found=1;next} found && /^BRIDGEEOF$/{exit} found{print}' \
            etunnel-src-extract.sh > components/universal-bridge/bridge.py

          awk "/^cat > \/opt\/rocket\/rocket-proxy.js <<'JSEOF'/{found=1;next} found && /^JSEOF\$/{exit} found{print}" \
            etunnel-src-extract.sh > components/rocket-proxy/rocket-proxy.js

          rm -f etunnel-src-extract.sh
          echo "panel/etunnel: $(head -1 panel/etunnel)"

      - name: Set release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Commit binaries and panel files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etunnel-v1.0.0.sh etunnel-v1.0.0-p2.sh panel/ components/ config/ issue.net
          git diff --cached --quiet || \
            git commit -m "build: shc binaries + sync panel [${{ steps.tag.outputs.tag }}]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "E-TUNNEL VPN ${{ steps.tag.outputs.tag }}"
          body: |
            ## E-TUNNEL VPN — Build by EMMKASH TECH

            ### Install on your VPS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/etunnelvpn/script1/main/etunnel-v1.0.0.sh -o /tmp/etunnel && chmod +x /tmp/etunnel && /tmp/etunnel
            ```
            ### With domain pre-set
            ```bash
            curl -fsSL https://raw.githubusercontent.com/etunnelvpn/script1/main/etunnel-v1.0.0.sh -o /tmp/etunnel && chmod +x /tmp/etunnel && /tmp/etunnel yourdomain.com
            ```
            > Protected binary — cannot be read or modified
            > Linux x86_64 (Ubuntu 20.04 / 22.04 / 24.04)
          files: |
            etunnel-v1.0.0.sh
            etunnel-v1.0.0-p2.sh
          draft: false
          prerelease: false