name: Build E-TUNNEL Binary

# Triggers: runs when you push etunnel-v1.0.0.sh OR manually from GitHub Actions tab
on:
  push:
    paths:
      - 'etunnel-v1.0.0.sh'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write   # needed to create releases and upload assets

    steps:

      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install shc
      - name: Install shc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shc
          echo "shc version: $(shc -v 2>&1 | head -1)"

      # 3. Compile the script into a binary
      - name: Compile with shc
        run: |
          shc -r -f etunnel-v1.0.0.sh -o etunnel
          chmod +x etunnel
          rm -f etunnel-v1.0.0.sh.x.c
          echo "Binary size: $(du -sh etunnel | cut -f1)"
          file etunnel

      # 4. Get version tag (uses date + short commit hash)
      - name: Set release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      # 5. Create a GitHub Release and upload the binary
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "E-TUNNEL VPN ${{ steps.tag.outputs.tag }}"
          body: |
            ## E-TUNNEL VPN — Auto Build

            Built from `etunnel-v1.0.0.sh` by EMMKASH TECH

            ### Install on your VPS
            ```bash
            curl -fsSL https://github.com/etunnelvpn/script1/releases/latest/download/etunnel -o /tmp/etunnel && bash /tmp/etunnel
            ```

            ### With domain pre-set
            ```bash
            curl -fsSL https://github.com/etunnelvpn/script1/releases/latest/download/etunnel -o /tmp/etunnel && bash /tmp/etunnel yourdomain.com
            ```

            > Compiled for Linux x86_64 (Ubuntu 20.04 / 22.04 / 24.04)
          files: etunnel
          draft: false
          prerelease: false