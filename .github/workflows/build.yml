name: Build E-TUNNEL Binary

on:
  push:
    paths:
      - 'etunnel-v1.0.0.sh'
      - 'panel/**'
      - 'components/**'
      - 'config/**'
      - 'issue.net'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shc
          echo "shc installed: $(shc -v 2>&1 | head -1)"

      - name: Compile and replace source with binary
        run: |
          # Compile source into binary
          shc -r -f etunnel-v1.0.0.sh -o etunnel-v1.0.0.sh.bin
          rm -f etunnel-v1.0.0.sh.x.c

          # Replace the source file with the binary (same filename)
          mv etunnel-v1.0.0.sh etunnel-v1.0.0.sh.src
          mv etunnel-v1.0.0.sh.bin etunnel-v1.0.0.sh
          chmod +x etunnel-v1.0.0.sh

          echo "Binary size: $(du -sh etunnel-v1.0.0.sh | cut -f1)"
          file etunnel-v1.0.0.sh

      - name: Extract panel files from source (before it was replaced)
        run: |
          awk '/^cat > \/usr\/local\/bin\/menu <<.PANEL./{found=1; next} found && /^PANEL$/{exit} found{print}' etunnel-v1.0.0.sh.src > panel/etunnel
          chmod +x panel/etunnel

          awk '/^cat > \/usr\/local\/bin\/etunnel-watchdog.sh <<.WDPY./{found=1; next} found && /^WDPY$/{exit} found{print}' etunnel-v1.0.0.sh.src > panel/etunnel-watchdog.sh
          chmod +x panel/etunnel-watchdog.sh

          awk '/^cat > \/usr\/local\/bin\/etunnel-quota-check.py <<.PYCHECK./{found=1; next} found && /^PYCHECK$/{exit} found{print}' etunnel-v1.0.0.sh.src > panel/etunnel-quota-check.py

          awk '/^cat > \/opt\/universal-bridge\/bridge.py << .BRIDGEEOF./{found=1; next} found && /^BRIDGEEOF$/{exit} found{print}' etunnel-v1.0.0.sh.src > components/universal-bridge/bridge.py

          awk "/^cat > \/opt\/rocket\/rocket-proxy.js <<'JSEOF'/{found=1; next} found && /^JSEOF\$/{exit} found{print}" etunnel-v1.0.0.sh.src > components/rocket-proxy/rocket-proxy.js

          # Remove source backup — never commit it
          rm -f etunnel-v1.0.0.sh.src

          echo "Panel files extracted:"
          head -1 panel/etunnel
          head -1 components/universal-bridge/bridge.py

      - name: Set release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Commit binary + panel files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etunnel-v1.0.0.sh panel/ components/ config/ issue.net
          git diff --cached --quiet || git commit -m "build: replace source with compiled binary [${{ steps.tag.outputs.tag }}]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "E-TUNNEL VPN ${{ steps.tag.outputs.tag }}"
          body: |
            ## E-TUNNEL VPN — Auto Build by EMMKASH TECH

            ### Install on your VPS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/etunnelvpn/script1/main/etunnel-v1.0.0.sh -o /tmp/etunnel.sh && bash /tmp/etunnel.sh
            ```
            ### With domain pre-set
            ```bash
            curl -fsSL https://raw.githubusercontent.com/etunnelvpn/script1/main/etunnel-v1.0.0.sh -o /tmp/etunnel.sh && bash /tmp/etunnel.sh yourdomain.com
            ```
            > Compiled binary — Linux x86_64 (Ubuntu 20.04 / 22.04 / 24.04)
          files: etunnel-v1.0.0.sh
          draft: false
          prerelease: false