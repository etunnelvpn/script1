name: Obfuscate and Sync E-TUNNEL

on:
  push:
    paths:
      - 'etunnel-v1.0.0.sh'
      - 'etunnel-v1.0.0-p2.sh'
      - 'panel/**'
      - 'components/**'
      - 'config/**'
      - 'issue.net'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Check if .sh files are already obfuscated ──────────────────────
      - name: Check if shell scripts are already obfuscated
        id: check
        run: |
          P1_LINES=$(wc -l < etunnel-v1.0.0.sh)
          if [ "$P1_LINES" -le 10 ] && grep -q "base64 -d" etunnel-v1.0.0.sh 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Shell scripts already obfuscated - skipping shell obfuscation"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Plain shell source detected ($P1_LINES lines) - will obfuscate"
          fi

      # ── Extract panel heredocs (only from embedded blocks in p2) ───────
      - name: Extract panel files from source
        if: steps.check.outputs.skip == 'false'
        run: |
          awk '/^cat > \/usr\/local\/bin\/menu <<.PANEL./{found=1;next} found && /^PANEL$/{exit} found{print}' \
            etunnel-v1.0.0-p2.sh > panel/etunnel && chmod +x panel/etunnel

          awk '/^cat > \/usr\/local\/bin\/etunnel-watchdog.sh <<.WDPY./{found=1;next} found && /^WDPY$/{exit} found{print}' \
            etunnel-v1.0.0-p2.sh > panel/etunnel-watchdog.sh && chmod +x panel/etunnel-watchdog.sh

          awk '/^cat > \/usr\/local\/bin\/etunnel-quota-check.py <<.PYCHECK./{found=1;next} found && /^PYCHECK$/{exit} found{print}' \
            etunnel-v1.0.0-p2.sh > panel/etunnel-quota-check.py

          echo "panel/etunnel first line: $(head -1 panel/etunnel)"

      # ── Obfuscate shell scripts ─────────────────────────────────────────
      - name: Obfuscate shell scripts with base64
        if: steps.check.outputs.skip == 'false'
        run: |
          obfuscate_sh() {
            local src="$1" dst="$2"
            local tmp
            tmp=$(mktemp)
            base64 -w 0 "$src" > "${tmp}.b64"
            {
              echo '#!/bin/bash'
              echo '# E-TUNNEL VPN by EMMKASH TECH'
              echo -n 'eval "$(echo '\'
              cat "${tmp}.b64"
              echo '\' | base64 -d)"'
            } > "$tmp"
            chmod +x "$tmp"
            mv "$tmp" "$dst"
            rm -f "${tmp}.b64"
            echo "Obfuscated $src -> $dst ($(wc -c < $dst) bytes)"
          }
          obfuscate_sh etunnel-v1.0.0.sh    etunnel-v1.0.0.sh
          obfuscate_sh etunnel-v1.0.0-p2.sh etunnel-v1.0.0-p2.sh

      # ── Obfuscate component files (runs ALWAYS, independent of skip) ───
      # These files live in components/ as plain source and must always be
      # obfuscated before committing — their skip check is done per-file.
      - name: Obfuscate component files
        run: |
          set -x  # print every command so we can see exactly what runs

          echo "=== PWD: $(pwd) ==="
          echo "=== Files present ==="
          ls -la components/universal-bridge/bridge.py \
                 components/vpn-panel/app.py \
                 components/rocket-proxy/rocket-proxy.js

          # Obfuscate bridge.py
          SRC="components/universal-bridge/bridge.py"
          SIZE=$(wc -c < "$SRC")
          echo "bridge.py size before: $SIZE"
          FIRST=$(head -1 "$SRC")
          echo "bridge.py first line: $FIRST"
          if echo "$FIRST" | grep -q "base64.b64decode\|exec(base64"; then
            echo "SKIP: bridge.py already obfuscated"
          else
            TMP=$(mktemp /tmp/bridge_XXXXXX.py)
            echo "TMP file: $TMP"
            base64 -w 0 "$SRC" > "${TMP}.b64"
            B64SIZE=$(wc -c < "${TMP}.b64")
            echo "base64 output size: $B64SIZE"
            echo '#!/usr/bin/env python3'          > "$TMP"
            echo '# E-TUNNEL VPN by EMMKASH TECH' >> "$TMP"
            echo -n 'import base64; exec(base64.b64decode("' >> "$TMP"
            cat "${TMP}.b64"                       >> "$TMP"
            echo '"))'                             >> "$TMP"
            TMPSIZE=$(wc -c < "$TMP")
            echo "TMP size after build: $TMPSIZE"
            cp "$TMP" "$SRC"
            rm -f "$TMP" "${TMP}.b64"
            echo "bridge.py final size: $(wc -c < $SRC)"
          fi

          # Obfuscate app.py
          SRC="components/vpn-panel/app.py"
          SIZE=$(wc -c < "$SRC")
          echo "app.py size before: $SIZE"
          FIRST=$(head -1 "$SRC")
          if echo "$FIRST" | grep -q "base64.b64decode\|exec(base64"; then
            echo "SKIP: app.py already obfuscated"
          else
            TMP=$(mktemp /tmp/app_XXXXXX.py)
            base64 -w 0 "$SRC" > "${TMP}.b64"
            B64SIZE=$(wc -c < "${TMP}.b64")
            echo "app.py base64 size: $B64SIZE"
            echo '#!/usr/bin/env python3'          > "$TMP"
            echo '# E-TUNNEL VPN by EMMKASH TECH' >> "$TMP"
            echo -n 'import base64; exec(base64.b64decode("' >> "$TMP"
            cat "${TMP}.b64"                       >> "$TMP"
            echo '"))'                             >> "$TMP"
            cp "$TMP" "$SRC"
            rm -f "$TMP" "${TMP}.b64"
            echo "app.py final size: $(wc -c < $SRC)"
          fi

          # Obfuscate rocket-proxy.js
          SRC="components/rocket-proxy/rocket-proxy.js"
          SIZE=$(wc -c < "$SRC")
          echo "rocket-proxy.js size before: $SIZE"
          FIRST=$(head -1 "$SRC")
          if echo "$FIRST" | grep -q "Buffer.from\|base64"; then
            echo "SKIP: rocket-proxy.js already obfuscated"
          else
            TMP=$(mktemp /tmp/rocket_XXXXXX.js)
            base64 -w 0 "$SRC" > "${TMP}.b64"
            B64SIZE=$(wc -c < "${TMP}.b64")
            echo "rocket-proxy.js base64 size: $B64SIZE"
            echo '// E-TUNNEL VPN by EMMKASH TECH'           > "$TMP"
            echo -n 'require("child_process").execSync(Buffer.from("' >> "$TMP"
            cat "${TMP}.b64"                                  >> "$TMP"
            echo '","base64").toString());'                   >> "$TMP"
            cp "$TMP" "$SRC"
            rm -f "$TMP" "${TMP}.b64"
            echo "rocket-proxy.js final size: $(wc -c < $SRC)"
          fi

          echo "=== FINAL sizes ==="
          ls -la components/universal-bridge/bridge.py \
                 components/vpn-panel/app.py \
                 components/rocket-proxy/rocket-proxy.js

      # ── Tag + commit + push ─────────────────────────────────────────────
      - name: Set release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Commit obfuscated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etunnel-v1.0.0.sh etunnel-v1.0.0-p2.sh panel/ components/ config/ issue.net
          git diff --cached --quiet || \
            git commit -m "build: obfuscate + sync panel [${{ steps.tag.outputs.tag }}]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "E-TUNNEL VPN ${{ steps.tag.outputs.tag }}"
          body: |
            ## E-TUNNEL VPN — Build by EMMKASH TECH

            ### Install on your VPS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/etunnelvpn/script1/main/etunnel-v1.0.0.sh -o /tmp/etunnel.sh && bash /tmp/etunnel.sh
            ```
            ### With domain pre-set
            ```bash
            curl -fsSL https://raw.githubusercontent.com/etunnelvpn/script1/main/etunnel-v1.0.0.sh -o /tmp/etunnel.sh && bash /tmp/etunnel.sh yourdomain.com
            ```
          files: |
            etunnel-v1.0.0.sh
            etunnel-v1.0.0-p2.sh
          draft: false
          prerelease: false
