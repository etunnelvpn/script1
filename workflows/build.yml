name: Obfuscate and Sync E-TUNNEL

on:
  push:
    paths:
      - 'etunnel-v1.0.0.sh'
      - 'etunnel-v1.0.0-p2.sh'
      - 'panel/**'
      - 'components/**'
      - 'config/**'
      - 'issue.net'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if files are already obfuscated
        id: check
        run: |
          P1_LINES=$(wc -l < etunnel-v1.0.0.sh)
          if [ "$P1_LINES" -le 10 ] && grep -q "base64 -d" etunnel-v1.0.0.sh 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Already obfuscated - skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Plain source detected ($P1_LINES lines) - will obfuscate"
          fi

      - name: Extract panel files from source (before obfuscation)
        if: steps.check.outputs.skip == 'false'
        run: |
          # Extract panel files that ARE embedded as heredocs in Part 2
          awk '/^cat > \/usr\/local\/bin\/menu <<.PANEL./{found=1;next} found && /^PANEL$/{exit} found{print}' \
            etunnel-v1.0.0-p2.sh > panel/etunnel && chmod +x panel/etunnel

          awk '/^cat > \/usr\/local\/bin\/etunnel-watchdog.sh <<.WDPY./{found=1;next} found && /^WDPY$/{exit} found{print}' \
            etunnel-v1.0.0-p2.sh > panel/etunnel-watchdog.sh && chmod +x panel/etunnel-watchdog.sh

          awk '/^cat > \/usr\/local\/bin\/etunnel-quota-check.py <<.PYCHECK./{found=1;next} found && /^PYCHECK$/{exit} found{print}' \
            etunnel-v1.0.0-p2.sh > panel/etunnel-quota-check.py

          # NOTE: bridge.py, rocket-proxy.js, and vpn-panel/app.py are NOT embedded
          # as heredocs in the script — they live directly in components/ and are
          # pulled at install time via repo_copy. Do NOT extract them from the script.

          echo "panel/etunnel first line: $(head -1 panel/etunnel)"
          echo "bridge.py size: $(wc -c < components/universal-bridge/bridge.py) bytes"
          echo "rocket-proxy.js size: $(wc -c < components/rocket-proxy/rocket-proxy.js) bytes"
          echo "app.py size: $(wc -c < components/vpn-panel/app.py) bytes"

      - name: Obfuscate both parts with base64
        if: steps.check.outputs.skip == 'false'
        run: |
          obfuscate_sh() {
            local src="$1" dst="$2"
            local b64
            b64=$(base64 -w 0 "$src")
            printf '#!/bin/bash\n# E-TUNNEL VPN by EMMKASH TECH\neval "$(echo '"'"'%s'"'"' | base64 -d)"\n' "$b64" > "$dst"
            chmod +x "$dst"
            echo "Obfuscated $src -> $dst ($(wc -l < $dst) lines)"
          }
          obfuscate_sh etunnel-v1.0.0.sh    etunnel-v1.0.0.sh
          obfuscate_sh etunnel-v1.0.0-p2.sh etunnel-v1.0.0-p2.sh

          obfuscate_py() {
            local src="$1"
            local b64
            b64=$(base64 -w 0 "$src")
            printf '#!/usr/bin/env python3\n# E-TUNNEL VPN by EMMKASH TECH\nimport base64,os\nexec(base64.b64decode("%s"))\n' "$b64" > "$src"
            echo "Obfuscated $src ($(wc -c < $src) bytes)"
          }
          obfuscate_js() {
            local src="$1"
            local b64
            b64=$(base64 -w 0 "$src")
            printf '// E-TUNNEL VPN by EMMKASH TECH\nrequire("child_process").execSync(Buffer.from("%s","base64").toString());\n' "$b64" > "$src"
            echo "Obfuscated $src ($(wc -c < $src) bytes)"
          }
          obfuscate_py components/universal-bridge/bridge.py
          obfuscate_py components/vpn-panel/app.py
          obfuscate_js components/rocket-proxy/rocket-proxy.js

      - name: Set release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Commit obfuscated files and panel files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etunnel-v1.0.0.sh etunnel-v1.0.0-p2.sh panel/ components/ config/ issue.net
          git diff --cached --quiet || \
            git commit -m "build: obfuscate + sync panel [${{ steps.tag.outputs.tag }}]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "E-TUNNEL VPN ${{ steps.tag.outputs.tag }}"
          body: |
            ## E-TUNNEL VPN — Build by EMMKASH TECH

            ### Install on your VPS
            ```bash
            curl -fsSL https://raw.githubusercontent.com/etunnelvpn/script1/main/etunnel-v1.0.0.sh -o /tmp/etunnel.sh && bash /tmp/etunnel.sh
            ```
            ### With domain pre-set
            ```bash
            curl -fsSL https://raw.githubusercontent.com/etunnelvpn/script1/main/etunnel-v1.0.0.sh -o /tmp/etunnel.sh && bash /tmp/etunnel.sh yourdomain.com
            ```
          files: |
            etunnel-v1.0.0.sh
            etunnel-v1.0.0-p2.sh
          draft: false
          prerelease: false